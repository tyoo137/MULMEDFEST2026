<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MULMEDFEST - Admin Portal</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #eef2fb;
            color: #2d3748;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-img {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            object-fit: cover;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 700;
            color: #3b4d8a;
        }

        .main-container {
            max-width: 1200px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
        }

        /* --- LOGIN CARD --- */
        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 24px;
            max-width: 400px;
            margin: 60px auto;
            box-shadow: 0 10px 30px rgba(148, 163, 184, 0.15);
            border: 1px solid #e2e8f0;
        }

        .login-card h2 {
            font-size: 22px;
            color: #1e293b;
            margin-bottom: 8px;
            text-align: center;
        }

        .login-card p {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 24px;
            text-align: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            background: #ffffff;
            border-color: #3b4d8a;
            box-shadow: 0 0 0 3px rgba(59, 77, 138, 0.15);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #3b4d8a;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: #2d3b6b;
        }

        /* --- DATABASE DASHBOARD --- */
        #adminDashboard {
            display: none;
        }

        .database-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 8px 25px rgba(148, 163, 184, 0.12);
            border: 1px solid #e2e8f0;
        }

        .db-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .db-title {
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
        }

        .db-actions {
            display: flex;
            gap: 10px;
        }

        .btn-refresh {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }

        th, td {
            padding: 12px 14px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 600;
        }

        .badge-tumbler {
            background: #dcfce7;
            color: #166534;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo-box">
            <img src="logo.png" alt="MULMEDFEST Logo" class="logo-img">
            <span class="logo-text">MULMEDFEST ADMIN</span>
        </a>
    </header>

    <div class="main-container">

        <!-- FORM LOGIN ADMIN -->
        <div id="loginSection" class="login-card">
            <h2>Portal Admin</h2>
            <p>Masukkan akun panitia untuk melihat database</p>
            
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="adminUser" placeholder="Username admin">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPass" placeholder="Password admin">
            </div>

            <button class="btn-login" onclick="prosesLoginAdmin()">Login Ke Dashboard</button>
        </div>

        <!-- DASHBOARD DATABASE ADMIN -->
        <div id="adminDashboard">
            <div class="database-card">
                <div class="db-header">
                    <h2 class="db-title">Database Cloud Pendaftar</h2>
                    <div class="db-actions">
                        <button class="btn-refresh" onclick="tampilkanDatabase()">🔄 Reload Data</button>
                        <button class="btn-logout" onclick="logoutAdmin()">Logout</button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Waktu</th>
                                <th>Nama</th>
                                <th>Instansi</th>
                                <th>Status</th>
                                <th>NIM/NIDN</th>
                                <th>WhatsApp</th>
                                <th>Email</th>
                                <th>Tumbler</th>
                            </tr>
                        </thead>
                        <tbody id="databaseTableBody">
                            <!-- Data pendaftar dimuat di sini -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT SYSTEM ADMIN -->
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-pt8o4DnhOs3IUxT_G1LpY_e2K85I7kA0lnUAo11Ccsj_8jHoIGHoS0QKt8D8d1F1Ww/exec";
        function prosesLoginAdmin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;

            // KREDENSIAL LOGIN ADMIN
            if (user === "admin" && pass === "mulmed2026") {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                tampilkanDatabase();
            } else {
                alert('Username atau Password Admin salah!');
            }
        }

        function logoutAdmin() {
            document.getElementById('adminUser').value = '';
            document.getElementById('adminPass').value = '';
            document.getElementById('adminDashboard').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
        }

        function tampilkanDatabase() {
            const tbody = document.getElementById('databaseTableBody');
            tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;">Memuat data dari Google Sheets...</td></tr>';

            fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                tbody.innerHTML = '';
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;">Belum ada data pendaftar.</td></tr>';
                    return;
                }

                data.forEach((row, index) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>#${index + 1}</td>
                        <td>${row.waktu || '-'}</td>
                        <td><strong>${row.nama || '-'}</strong></td>
                        <td>${row.instansi || '-'}</td>
                        <td>${row.status || '-'}</td>
                        <td>${row.id_number || '-'}</td>
                        <td>${row.whatsapp || '-'}</td>
                        <td>${row.email || '-'}</td>
                        <td><span class="badge-tumbler">${row.tumbler || '-'}</span></td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(err => {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; color:red;">Gagal mengambil data. Pastikan fungsi doGet pada Google Apps Script aktif.</td></tr>';
            });
        }
    </script>
</body>
</html>
